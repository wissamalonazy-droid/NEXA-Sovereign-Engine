<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA Sovereign Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .glass-panel { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; overflow: hidden; margin-bottom: 20px; }
        #codeEditor { width: 100%; height: 220px; background: white; color: #374151; font-family: 'Courier New', monospace; font-size: 14px; padding: 20px; outline: none; resize: none; border: none; }
        #lockOverlay { position: fixed; inset: 0; background-color: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .lock-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(25px); padding: 50px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.05); width: 90%; max-width: 420px; text-align: center; }
        .blue-glow-circle { width: 90px; height: 90px; background: #2563eb; border-radius: 50%; margin: 0 auto 25px; box-shadow: 0 0 40px rgba(37, 99, 235, 0.6); }
        #workspace { display: none; opacity: 0; transition: opacity 0.6s ease; }
    </style>
</head>
<body class="p-5 md:p-10">

    <div id="lockOverlay">
        <div class="lock-card">
            <div class="blue-glow-circle flex items-center justify-center"><i class="fas fa-shield-halved text-white text-5xl"></i></div>
            <h1 class="text-3xl font-black text-white italic tracking-tighter uppercase">NEXA <span class="text-blue-500 not-italic">CORE</span></h1>
            <p class="text-[10px] text-slate-500 font-bold tracking-[0.4em] uppercase mt-3 mb-10">Sovereign Protection Active</p>
            <input type="password" id="keyInput" placeholder="ENTER SOVEREIGN KEY" class="w-full bg-slate-900/60 border border-slate-700 rounded-2xl py-5 px-6 text-sm font-bold text-white outline-none mb-8 focus:border-blue-500">
            <button onclick="unlock()" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black tracking-widest active:scale-95 transition-all">UNLEASH ENGINE</button>
            <p id="errorMsg" class="text-red-500 text-[11px] mt-5 font-bold hidden">INVALID KEY</p>
        </div>
    </div>

    <div id="workspace" class="max-w-xl mx-auto">
        <div class="flex justify-between items-center mb-6 px-1">
            <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">Sovereign Live Editor</span>
            <button onclick="runAnalysis()" class="bg-slate-900 text-white text-[10px] font-black px-8 py-3 rounded-xl uppercase tracking-widest hover:bg-black">RUN ANALYSIS</button>
        </div>

        <div class="glass-panel">
            <div class="bg-gray-50/50 p-3 px-5 border-b border-gray-100 flex justify-between text-[10px] font-bold text-slate-400">
                <span>MAIN_SCRIPT.NXA</span>
                <span class="text-blue-500">EDITABLE MODE</span>
            </div>
            <textarea id="codeEditor" spellcheck="false">// Paste code here...</textarea>
        </div>

        <div class="glass-panel">
            <div class="bg-slate-800 p-3 px-5 text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-terminal text-blue-400"></i> SYSTEM OUTPUT
            </div>
            <div id="logs" class="bg-slate-900 p-6 min-h-[120px] text-[12px] font-mono text-slate-300 leading-relaxed"></div>
        </div>

        <div class="glass-panel">
            <div class="bg-gray-50/50 p-3 px-5 text-[10px] font-black text-slate-400 uppercase tracking-widest flex items-center gap-2 border-b border-gray-100">
                <i class="fas fa-database text-indigo-500"></i> MEMORY MONITOR
            </div>
            <div id="mem" class="p-4 space-y-3 text-[12px]"></div>
        </div>
    </div>

    <script>
        const MASTER_KEY = "NX-9922-PRO-SHIELD#SOVEREIGN";
        let currentVault = {};

        function unlock() {
            if(document.getElementById('keyInput').value === MASTER_KEY) {
                document.getElementById('lockOverlay').style.display = 'none';
                document.getElementById('workspace').style.display = 'block';
                setTimeout(() => document.getElementById('workspace').style.opacity = '1', 50);
            } else { document.getElementById('errorMsg').classList.remove('hidden'); }
        }

        function runAnalysis() {
            const code = document.getElementById('codeEditor').value;
            const logs = document.getElementById('logs');
            const mem = document.getElementById('mem');
            logs.innerHTML = '<span class="text-blue-400">[NXC]: Analyzing Sovereign Logic...</span>';
            mem.innerHTML = '';
            currentVault = {};
            let isVaultMode = false;

            code.split('\n').forEach((line, i) => {
                let l = line.trim();
                if(!l || l.startsWith("//")) return;

                // Handle Vault Opening
                if(l.includes("open vault")) { isVaultMode = true; return; }
                if(l === "}") { isVaultMode = false; return; }

                // Handle 'set'
                let setMatch = l.match(/set\s+(\w+)\s*->\s*(.*)/);
                if(setMatch) {
                    let [_, name, val] = setMatch;
                    if(isVaultMode) {
                        currentVault[name] = val.replace(/"/g, '');
                        addMemRow(name, "vault:Secret", "🔒 hash_" + Math.random().toString(16).slice(2,8));
                    } else {
                        addMemRow(name, "Public", val);
                    }
                }

                // Handle 'io.say' (The Security Guard)
                let sayMatch = l.match(/io\.say\(([^)]+)\)/);
                if(sayMatch) {
                    let varName = sayMatch[1].trim();
                    if(currentVault[varName]) {
                        logs.innerHTML += `<br><span class="text-red-500 font-bold">[ERROR]: Logic violation at line ${i+1}. Respect the Vault!</span>`;
                    } else {
                        logs.innerHTML += `<br>NX_Output: ${varName}`;
                    }
                }

                // Handle 'reveal'
                if(l.startsWith("reveal vault")) {
                    setTimeout(() => {
                        logs.innerHTML += '<br><span class="text-green-500 font-bold">[SUCCESS]: Decrypting Vault...</span>';
                        for (let key in currentVault) {
                            let el = document.getElementById('v_' + key);
                            if(el) { el.innerHTML = currentVault[key]; el.className = "font-bold text-green-600"; }
                        }
                    }, 1000);
                }
            });
        }

        function addMemRow(name, tag, val) {
            document.getElementById('mem').innerHTML += `
                <div class="flex justify-between border-b border-gray-50 pb-2">
                    <span class="font-bold">${name}</span>
                    <span class="text-[9px] bg-blue-50 text-blue-500 px-2 rounded border border-blue-100">${tag}</span>
                    <span id="v_${name}" class="text-slate-400 font-mono">${val}</span>
                </div>`;
        }
    </script>
</body>
</html>
