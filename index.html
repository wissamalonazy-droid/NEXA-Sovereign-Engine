<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA | SOVEREIGN LOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Courier New', monospace; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .access-granted { animation: unlockEffect 1s forwards; }
        @keyframes unlockEffect {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); visibility: hidden; }
        }
        #mainWorkspace { display: none; overflow-y: auto; height: 100vh; background-color: #f3f4f6; }
    </style>
</head>
<body>

    <div id="lockScreen" class="fixed inset-0 z-50 flex items-center justify-center p-6 transition-all duration-500">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl text-center">
            <div class="mb-6">
                <div class="bg-blue-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/50">
                    <i class="fas fa-shield-halved text-white text-2xl"></i>
                </div>
                <h1 class="text-white font-black text-2xl tracking-tighter">NEXA <span class="text-blue-400">CORE</span></h1>
                <p class="text-slate-400 text-[10px] uppercase tracking-[0.3em] mt-2">Sovereign Protection Active</p>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <i class="fas fa-key absolute left-4 top-4 text-slate-500"></i>
                    <input type="password" id="keyInput" placeholder="ENTER SOVEREIGN KEY" 
                        class="w-full bg-slate-900/50 border border-slate-700 rounded-xl py-4 pl-12 pr-4 text-blue-400 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-all text-sm tracking-widest">
                </div>
                <button onclick="authenticateKey()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                    UNLEASH ENGINE
                </button>
            </div>
            
            <p id="errorMsg" class="mt-4 text-red-500 text-[10px] font-bold uppercase hidden">Access Denied: Invalid Key</p>
        </div>
    </div>

    <div id="mainWorkspace" class="p-4 md:p-8">
        <div class="max-w-4xl mx-auto">
             <div class="flex justify-between items-center mb-8">
                <div class="flex items-center space-x-4">
                    <div class="bg-slate-900 p-3 rounded-xl"><i class="fas fa-shield-halved text-blue-400 text-xl"></i></div>
                    <h1 class="font-black text-2xl tracking-tighter text-slate-900">NEXA <span class="text-blue-600">Sovereign</span></h1>
                </div>
                <button onclick="executeNexa()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-black text-sm">EXECUTE CORE</button>
            </div>
            
            <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-6">
                <textarea id="codeEditor" class="w-full h-48 p-4 font-mono text-sm outline-none resize-none">// NEXA CORE v1.0 Ready
set system -> "NEXA PROTECT"
open vault: "Prime" -> {
    set secret -> 9922
}
reveal vault: "Prime"</textarea>
            </div>
            
            <div id="consoleOutput" class="bg-slate-900 text-gray-300 p-5 font-mono text-xs rounded-xl h-40 overflow-auto mb-6 leading-relaxed">
                // System Authorized.
            </div>

            <div class="text-center text-slate-400 text-[10px] uppercase tracking-widest">NEXA Sovereign Tech © 2026</div>
        </div>
    </div>

    <script>
        // دالة التحقق من المفتاح
        function authenticateKey() {
            const input = document.getElementById('keyInput').value;
            const lock = document.getElementById('lockScreen');
            const work = document.getElementById('mainWorkspace');
            const error = document.getElementById('errorMsg');

            if (input === "NEXA_9922_ORIGINAL") {
                // تأثير الفتح
                lock.classList.add('access-granted');
                setTimeout(() => {
                    lock.style.display = 'none';
                    work.style.display = 'block';
                    document.body.style.backgroundColor = "#f3f4f6";
                    document.body.style.overflow = "auto";
                }, 800);
            } else {
                error.classList.remove('hidden');
                document.getElementById('keyInput').classList.add('border-red-500');
                setTimeout(() => {
                    error.classList.add('hidden');
                    document.getElementById('keyInput').classList.remove('border-red-500');
                }, 2000);
            }
        }

        // دالة الـ Execute (نفس حقتنا السابقة)
        function executeNexa() {
            const consoleBox = document.getElementById('consoleOutput');
            consoleBox.innerHTML = '<span class="text-blue-400">[NXC]: Executing Sovereign Logic...</span>';
            setTimeout(() => {
                consoleBox.innerHTML += '<br><span class="text-green-500 font-bold">// NEXA CORE: Success. Access to Vault Granted.</span>';
            }, 1000);
        }
    </script>
</body>
</html>
