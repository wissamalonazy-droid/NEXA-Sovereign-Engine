<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXA Sovereign Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: #f8fafc; }
        .nexa-card { background: linear-gradient(145deg, #0f172a, #020617); border: 1px solid #1e293b; }
        .accent-blue { color: #3b82f6; }
    </style>
</head>
<body class="p-10">
    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12 border-b border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter italic">NEXA <span class="text-blue-500">ELUCE</span></h1>
                <p class="text-slate-500 text-sm">Sovereign Data Management Engine</p>
            </div>
            <div class="text-right">
                <span class="bg-green-900/30 text-green-400 px-3 py-1 rounded-full text-xs font-bold border border-green-800">SYSTEM: ACTIVE</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="nexa-card p-8 rounded-3xl shadow-2xl">
                <h3 class="text-xl font-bold mb-6 flex items-center"><i class="fas fa-vault mr-3 accent-blue"></i> Active Vault</h3>
                <div class="space-y-4">
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Customer_Name</span>
                        <span class="font-mono text-blue-400 italic">4a7d...3e9</span>
                    </div>
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="text-slate-400">Balance_Qadr</span>
                        <span class="font-mono text-blue-400 italic">9f2c...1a2</span>
                    </div>
                </div>
                <button class="w-full mt-8 bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-bold transition">REVEAL SOVEREIGN DATA</button>
            </div>

            <div class="nexa-card p-8 rounded-3xl">
                <h3 class="text-xl font-bold mb-6 flex items-center"><i class="fas fa-terminal mr-3 text-red-500"></i> Attack Monitor</h3>
                <div class="text-xs font-mono space-y-2">
                    <p class="text-red-400">[ATTACK] Unauthorized 'io.say' detected.</p>
                    <p class="text-slate-500">[INFO] Logic Shield Activated.</p>
                    <p class="text-green-400">[SAFE] Data remains encrypted in Vault.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
