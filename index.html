<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA | LIVE CODE WORKSHOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Courier New', Courier, monospace; }
        .editor-container { background-color: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; overflow: hidden; }
        #codeEditor {
            width: 100%;
            height: 200px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #374151;
            border: none;
            outline: none;
            resize: none;
            background-attachment: local;
            background-image: linear-gradient(#ffffff 50%, #f9fafb 50%);
            background-size: 100% 3rem;
            line-height: 1.5rem;
        }
        .console-bg { background-color: #1a1a1a; color: #d1d5db; }
        .vault-tag { background-color: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .reveal-data { color: #166534; font-weight: bold; background-color: #f0fdf4; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-6">
        <div class="flex items-center space-x-3">
            <div class="bg-gray-200 p-2 rounded-lg"><i class="fas fa-code text-gray-600"></i></div>
            <div>
                <h1 class="font-bold text-lg leading-tight">NEXA <span class="text-blue-600">ELUCE</span></h1>
                <p class="text-xs text-gray-500">Sovereign Live Editor</p>
            </div>
        </div>
        <button id="runBtn" onclick="executeNexa()" class="bg-[#1a1a1a] text-white px-6 py-2 rounded-md font-bold flex items-center hover:bg-black transition">
            <i class="fas fa-play mr-2 text-[10px]"></i> RUN SCRIPT
        </button>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        
        <div class="editor-container">
            <div class="flex p-3 bg-gray-50 border-b border-gray-100 items-center justify-between text-gray-500 text-xs">
                <span><i class="fas fa-file-code mr-2 text-blue-500"></i> MAIN_SCRIPT.NXA</span>
                <span class="text-[10px] bg-white px-2 py-1 rounded border">EDITABLE MODE</span>
            </div>
            <textarea id="codeEditor" spellcheck="false">// Try editing this code!
set store -> "SUHAIL ELUCE Luxury"
open vault: "Secret_Vault" -> {
    set adminKey -> 9922
    set password -> "NEXA_PRO_2026"
}
io.say(store)
io.say(password)
reveal vault: "Secret_Vault"</textarea>
        </div>

        <div class="editor-container overflow-hidden">
            <div class="flex p-3 bg-[#262626] items-center text-gray-400 text-[10px] font-bold uppercase tracking-widest">
                <i class="fas fa-terminal mr-2"></i> System Output
            </div>
            <div id="consoleOutput" class="console-bg p-4 space-y-1 text-xs font-mono h-[120px] overflow-auto">
                // System initialized. Edit code above and click RUN.
            </div>
        </div>

        <div class="editor-container">
            <div class="flex p-3 bg-gray-50 border-b border-gray-100 items-center text-gray-500 text-xs font-bold uppercase">
                <i class="fas fa-database mr-2 text-indigo-500"></i> Memory Monitor
            </div>
            <div class="p-4">
                <table class="w-full text-sm">
                    <tbody id="memoryBody">
                        <tr class="text-gray-400 text-center"><td class="py-4">No data in memory.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        function executeNexa() {
            const code = document.getElementById('codeEditor').value;
            const consoleBox = document.getElementById('consoleOutput');
            const memoryBody = document.getElementById('memoryBody');
            const runBtn = document.getElementById('runBtn');

            // Loading Effect
            runBtn.innerHTML = '<i class="fas fa-sync fa-spin mr-2"></i> COMPILING...';
            consoleBox.innerHTML = '<span class="text-blue-400">[NXC]: Analyzing Sovereign Logic...</span>';
            memoryBody.innerHTML = '';

            setTimeout(() => {
                // محاكاة معالجة الكود المكتوب
                consoleBox.innerHTML += '<br><span class="text-gray-500">[SYSTEM]: Script parsed successfully.</span>';
                
                // إضافة المتغيرات العامة
                if(code.includes('store')) {
                    addRow('store', 'Bayan', '"SUHAIL ELUCE"', 'Public');
                    consoleBox.innerHTML += '<br>NX_Output: "SUHAIL ELUCE"';
                }

                // محاكاة الحماية (Vault)
                if(code.includes('vault')) {
                    addRow('adminKey', 'Qadr', '7e8c...2a', 'vault:Secret', true);
                    addRow('password', 'Bayan', '9f1a...4d', 'vault:Secret', true);
                    
                    if(code.includes('io.say(password)')) {
                        consoleBox.innerHTML += '<br><span class="text-red-500">[NEXA]: Logic violation. Access Denied!</span>';
                    }
                }

                // محاكاة الـ Reveal
                if(code.includes('reveal')) {
                    setTimeout(() => {
                        consoleBox.innerHTML += '<br><span class="text-green-500 font-bold">--- [NXC]: REVEALING SOVEREIGN DATA ---</span>';
                        consoleBox.innerHTML += '<br><span class="text-green-400">[UNLOCKED]: adminKey -> 9922</span>';
                        revealTable();
                    }, 1000);
                }

                runBtn.innerHTML = '<i class="fas fa-play mr-2 text-[10px]"></i> RUN SCRIPT';
            }, 800);
        }

        function addRow(name, type, val, context, locked = false) {
            const body = document.getElementById('memoryBody');
            body.innerHTML += `
                <tr class="border-b border-gray-50">
                    <td class="py-3 font-bold">${name}</td>
                    <td class="py-3"><span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[10px]">${type}</span> <span class="vault-tag ml-2">${context}</span></td>
                    <td class="py-3 text-right font-mono text-gray-400" id="val_${name}">${locked ? '<i class="fas fa-lock text-[10px] mr-1"></i>'+val : val}</td>
                </tr>`;
        }

        function revealTable() {
            document.getElementById('val_adminKey').innerHTML = "9922";
            document.getElementById('val_adminKey').className = "py-3 text-right reveal-data";
            document.getElementById('val_password').innerHTML = "NEXA_PRO_2026";
            document.getElementById('val_password').className = "py-3 text-right reveal-data";
        }
    </script>
</body>
</html>
