<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200"> <title>NEXA | SOVEREIGN WORKSPACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: 'Courier New', Courier, monospace; min-width: 1200px; color: #f1f5f9; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; }
        #codeEditor {
            width: 100%; height: 400px; background: transparent; color: #94a3b8;
            font-family: 'Fira Code', 'Courier New', monospace; font-size: 15px;
            line-height: 1.6; border: none; outline: none; resize: none; padding: 20px;
        }
        .console-text { font-family: 'Fira Code', monospace; font-size: 13px; }
        .vault-tag { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .reveal-animation { animation: revealPulse 1s ease-out; color: #4ade80 !important; font-weight: bold; }
        @keyframes revealPulse { 0% { background: rgba(74, 222, 128, 0.2); } 100% { background: transparent; } }
    </style>
</head>
<body class="p-10">

    <div class="max-w-[1200px] mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center space-x-4">
            <div class="p-3 bg-blue-600 rounded-xl shadow-lg shadow-blue-500/20">
                <i class="fas fa-shield-halved text-white text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tighter uppercase italic">NEXA <span class="text-blue-500 not-italic">Sovereign</span></h1>
                <p class="text-[10px] text-slate-500 font-bold tracking-[0.3em] uppercase">Core Security Workshop v1.1</p>
            </div>
        </div>
        <button id="runBtn" onclick="executeNexa()" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-lg font-black tracking-widest transition-all active:scale-95 shadow-lg shadow-blue-600/20">
            <i class="fas fa-play mr-2"></i> EXECUTE CORE
        </button>
    </div>

    <div class="max-w-[1200px] mx-auto grid grid-cols-12 gap-6">
        
        <div class="col-span-8 glass-panel overflow-hidden shadow-2xl">
            <div class="bg-slate-800/50 p-3 border-b border-white/5 flex justify-between items-center text-[11px] font-bold text-slate-400">
                <span><i class="fas fa-file-code mr-2 text-blue-400"></i> MAIN_SCRIPT.NXA</span>
                <span class="text-green-500 flex items-center"><i class="fas fa-circle text-[6px] mr-2"></i> SYSTEM READY</span>
            </div>
<textarea id="codeEditor" spellcheck="false">// NEXA Sovereign Language
set system -> "NEXA CORE v1.1"

open vault: "Security_Cell" -> {
    set masterKey -> 9922
    set userToken -> "NX-ALPHA-77"
}

io.say(system)
io.say(masterKey) // This triggers Logic Violation
reveal vault: "Security_Cell"</textarea>
        </div>

        <div class="col-span-4 space-y-6">
            
            <div class="glass-panel h-[230px] flex flex-col">
                <div class="bg-slate-800/50 p-3 border-b border-white/5 text-[10px] font-bold text-slate-500 tracking-widest">
                    <i class="fas fa-terminal mr-2"></i> SYSTEM LOGS
                </div>
                <div id="consoleBox" class="p-4 overflow-auto flex-grow console-text text-slate-400 space-y-2">
                    // Waiting for instructions...
                </div>
            </div>

            <div class="glass-panel h-[230px] flex flex-col">
                <div class="bg-slate-800/50 p-3 border-b border-white/5 text-[10px] font-bold text-slate-500 tracking-widest">
                    <i class="fas fa-microchip mr-2"></i> MEMORY MAP
                </div>
                <div class="p-0 overflow-auto flex-grow">
                    <table class="w-full text-left text-[12px]">
                        <tbody id="memoryBody" class="divide-y divide-white/5">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1200px] mx-auto mt-8 flex justify-between items-center text-[10px] font-bold text-slate-600 tracking-[0.2em] uppercase border-t border-white/5 pt-6">
        <div class="flex space-x-10">
            <span>ENCRYPTION: <span class="text-blue-500">AES-256-BIT</span></span>
            <span>AUTH: <span class="text-slate-300 italic">SOVEREIGN_KEY_9922</span></span>
        </div>
        <span>&copy; 2026 NEXA SOVEREIGN TECH SYSTEMS</span>
    </div>

    <script>
        function executeNexa() {
            const code = document.getElementById('codeEditor').value;
            const consoleBox = document.getElementById('consoleBox');
            const memoryBody = document.getElementById('memoryBody');
            const runBtn = document.getElementById('runBtn');

            runBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> ANALYZING...';
            consoleBox.innerHTML = '<span class="text-blue-400 font-bold">[INIT]: Processing Sovereign Code...</span>';
            memoryBody.innerHTML = '';

            setTimeout(() => {
                const lines = code.split('\n');
                let hasError = false;

                lines.forEach((line, index) => {
                    let trim = line.trim();
                    if (!trim || trim.startsWith("//")) return;

                    // 1. Detection of violations (Red Text)
                    if (trim.includes("io.say") && (trim.includes("masterKey") || trim.includes("userToken"))) {
                        consoleBox.innerHTML += `<br><span class="text-red-500 font-bold">[ERROR]: Logic violation at line ${index+1}. Respect the Vault!</span>`;
                        hasError = true;
                    }

                    // 2. Set Commands
                    if (trim.includes("system")) {
                        addMemoryRow('system', 'Bayan', '"NEXA CORE"', 'Public');
                        consoleBox.innerHTML += '<br>NX_Output: "NEXA CORE v1.1"';
                    }

                    if (trim.includes("open vault")) {
                        consoleBox.innerHTML += '<br><span class="text-slate-500">[NXC]: Shielding sensitive memory cell...</span>';
                        addMemoryRow('masterKey', 'Qadr', '7e8c...2a', 'vault:Secure', true);
                        addMemoryRow('userToken', 'Bayan', '9f1a...4d', 'vault:Secure', true);
                    }

                    // 3. Reveal Command
                    if (trim.includes("reveal vault") && !hasError) {
                        setTimeout(() => {
                            consoleBox.innerHTML += '<br><span class="text-green-500 font-bold">--- [NXC]: ACCESS GRANTED ---</span>';
                            revealData();
                        }, 800);
                    }
                });

                if(!hasError) consoleBox.innerHTML += '<br><span class="text-slate-500">// Script execution successful.</span>';
                runBtn.innerHTML = '<i class="fas fa-play mr-2"></i> EXECUTE CORE';
            }, 1000);
        }

        function addMemoryRow(name, type, val, context, locked) {
            const body = document.getElementById('memoryBody');
            body.innerHTML += `
                <tr class="hover:bg-white/5 transition-colors">
                    <td class="px-4 py-3 font-bold text-slate-300">${name}</td>
                    <td class="px-4 py-3"><span class="vault-tag">${context}</span></td>
                    <td class="px-4 py-3 text-right font-mono text-slate-500" id="v_${name}">${locked ? '<i class="fas fa-lock mr-2 text-[9px]"></i>'+val : val}</td>
                </tr>`;
        }

        function revealData() {
            const k = document.getElementById('v_masterKey');
            const t = document.getElementById('v_userToken');
            if(k) { k.innerHTML = "9922"; k.className = "px-4 py-3 text-right reveal-animation"; }
            if(t) { t.innerHTML = "NX-ALPHA-77"; t.className = "px-4 py-3 text-right reveal-animation"; }
        }
    </script>
</body>
</html>
