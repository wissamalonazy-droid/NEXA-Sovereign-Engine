<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA | SOVEREIGN CORE ENGINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; font-family: 'Courier New', Courier, monospace; }
        .editor-container { background-color: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        #codeEditor {
            width: 100%;
            height: 220px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #374151;
            border: none;
            outline: none;
            resize: none;
            background-image: linear-gradient(#ffffff 50%, #f9fafb 50%);
            background-size: 100% 3rem;
        }
        .console-bg { background-color: #1a1a1a; color: #d1d5db; border-radius: 0 0 8px 8px; }
        .vault-tag { background-color: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .reveal-data { color: #15803d; font-weight: bold; background-color: #f0fdf4; }
        .error-text { color: #dc2626; font-weight: bold; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center space-x-4">
            <div class="bg-slate-900 p-3 rounded-xl shadow-lg shadow-blue-900/20">
                <i class="fas fa-shield-halved text-blue-400 text-xl"></i>
            </div>
            <div>
                <h1 class="font-black text-2xl tracking-tighter text-slate-900 uppercase">NEXA <span class="text-blue-600 font-light italic">Sovereign</span></h1>
                <p class="text-[10px] text-slate-400 font-bold tracking-[0.2em] uppercase">Advanced Data Shield Engine</p>
            </div>
        </div>
        <button id="runBtn" onclick="executeNexa()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-black text-sm tracking-widest hover:bg-blue-700 shadow-lg shadow-blue-600/30 transition-all active:scale-95">
            <i class="fas fa-play mr-2"></i> EXECUTE CORE
        </button>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        
        <div class="editor-container">
            <div class="flex p-3 bg-slate-50 border-b border-slate-100 items-center justify-between text-[10px] font-bold text-slate-400">
                <span><i class="fas fa-file-code mr-2 text-blue-500"></i> WORKSPACE / SCRIPTS / MAIN.NXA</span>
                <span class="flex items-center"><i class="fas fa-circle text-green-500 text-[6px] mr-2"></i> LIVE EDITOR</span>
            </div>
            <textarea id="codeEditor" spellcheck="false">// NEXA Sovereign Language Template
set systemName -> "NEXA CORE v1.0"
set authLevel -> "Administrator"

open vault: "Security_Cell" -> {
    set masterKey -> 9922
    set userToken -> "NX-7788-ALPHA"
}

io.say(systemName)
io.say(userToken) // This should trigger logic violation
reveal vault: "Security_Cell"</textarea>
        </div>

        <div class="editor-container">
            <div class="flex p-3 bg-[#111827] items-center text-slate-500 text-[9px] font-black uppercase tracking-widest border-b border-slate-800">
                <i class="fas fa-terminal mr-2 text-blue-400"></i> System Logs & Output
            </div>
            <div id="consoleOutput" class="console-bg p-5 space-y-2 text-xs font-mono h-[140px] overflow-auto">
                <span class="text-slate-600">// Engine initialized. Waiting for execution...</span>
            </div>
        </div>

        <div class="editor-container">
            <div class="flex p-3 bg-slate-50 border-b border-slate-100 items-center text-slate-500 text-[9px] font-black uppercase tracking-widest">
                <i class="fas fa-microchip mr-2 text-indigo-500"></i> Memory Allocation Table
            </div>
            <div class="p-0">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50/50 text-[10px] text-slate-400 uppercase border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-3">Variable</th>
                            <th class="px-6 py-3">Data Type</th>
                            <th class="px-6 py-3 text-right">Encrypted State</th>
                        </tr>
                    </thead>
                    <tbody id="memoryBody" class="divide-y divide-slate-50">
                        <tr><td colspan="3" class="py-10 text-center text-slate-300 italic">No variables in memory.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="flex justify-between items-center p-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">
            <div class="flex space-x-6">
                <span>Encryption: <span class="text-slate-900">SHA-256</span></span>
                <span>Security: <span class="text-blue-600 font-black">Level 5</span></span>
            </div>
            <div>Build: 2026.04.26</div>
        </div>

    </div>

    <script>
        function executeNexa() {
            const code = document.getElementById('codeEditor').value;
            const consoleBox = document.getElementById('consoleOutput');
            const memoryBody = document.getElementById('memoryBody');
            const runBtn = document.getElementById('runBtn');

            runBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> ANALYZING...';
            consoleBox.innerHTML = '<span class="text-blue-400 font-bold">[INIT]: NEXA Sovereign Engine starting...</span>';
            memoryBody.innerHTML = '';

            setTimeout(() => {
                const lines = code.split('\n');
                let hasError = false;

                lines.forEach((line, index) => {
                    let trim = line.trim();
                    if (!trim || trim.startsWith("//")) return;

                    // Logic Violation Check (The Red Warning)
                    if (trim.includes("io.say") && (trim.includes("userToken") || trim.includes("masterKey"))) {
                        consoleBox.innerHTML += `<br><span class="error-text">[CRITICAL]: Logic violation at line ${index+1}. Respect the Vault!</span>`;
                        hasError = true;
                    }

                    // Process Public Data
                    if (trim.includes("systemName")) {
                        addVar('systemName', 'Bayan', '"NEXA CORE"', 'Public');
                        consoleBox.innerHTML += '<br><span class="text-slate-300">NX_Output: "NEXA CORE v1.0"</span>';
                    }

                    // Process Vault
                    if (trim.includes("open vault")) {
                        consoleBox.innerHTML += '<br><span class="text-blue-300">[VAULT]: Shielding sensitive memory cell...</span>';
                        addVar('masterKey', 'Qadr', '7e8c...2a', 'vault:Security', true);
                        addVar('userToken', 'Bayan', '9f1a...4d', 'vault:Security', true);
                    }

                    // Reveal Command
                    if (trim.includes("reveal vault") && !hasError) {
                        setTimeout(() => {
                            consoleBox.innerHTML += '<br><span class="text-green-500 font-bold">--- [NXC]: SOVEREIGN ACCESS GRANTED ---</span>';
                            consoleBox.innerHTML += '<br><span class="text-green-400 text-[10px] italic">// Decrypting Vault: Security_Cell...</span>';
                            revealAll();
                        }, 800);
                    }
                });

                if(!hasError) consoleBox.innerHTML += '<br><span class="text-green-600 font-bold">// EXECUTION FINISHED SUCCESSFULLY.</span>';
                runBtn.innerHTML = '<i class="fas fa-play mr-2"></i> EXECUTE CORE';
            }, 1000);
        }

        function addVar(name, type, val, context, locked) {
            const body = document.getElementById('memoryBody');
            body.innerHTML += `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4 font-bold text-slate-800">${name}</td>
                    <td class="px-6 py-4"><span class="bg-slate-100 text-slate-500 px-2 py-1 rounded text-[9px] font-black mr-2">${type}</span> <span class="vault-tag">${context}</span></td>
                    <td class="px-6 py-4 text-right font-mono text-slate-400" id="v_${name}">${locked ? '<i class="fas fa-lock mr-2 text-[9px]"></i>'+val : val}</td>
                </tr>`;
        }

        function revealAll() {
            const v1 = document.getElementById('v_masterKey');
            const v2 = document.getElementById('v_userToken');
            if(v1) { v1.innerHTML = "9922"; v1.className = "px-6 py-4 text-right reveal-data"; }
            if(v2) { v2.innerHTML = "NX-7788-ALPHA"; v2.className = "px-6 py-4 text-right reveal-data"; }
        }
    </script>
</body>
</html>
